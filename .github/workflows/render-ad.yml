name: Render ad preview
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/render-ad.mjs"
      - ".github/workflows/render-ad.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser renderer
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture the actual page
        run: node scripts/render-ad.mjs
      - name: Commit page screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ad.png
          if ! git diff --cached --quiet; then
            git commit -m "Add rendered ad page preview"
            git push
          fi
